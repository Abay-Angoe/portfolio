    <g stroke="#9db7d6" stroke-width="12" stroke-linecap="round">
      <line x1="180" y1="170" x2="300" y2="170" />
      <line x1="180" y1="205" x2="300" y2="205" />
      <line x1="180" y1="240" x2="260" y2="240" />
    </g>
    <!-- loupe -->
    <circle cx="320" cy="320" r="58" fill="none" stroke="#fff" stroke-width="22" />
    <line x1="360" y1="360" x2="400" y2="400" stroke="#fff" stroke-width="26" stroke-linecap="round" />
